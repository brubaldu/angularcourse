<h4>Internal Server Error</h4>
@if (error){
    <h5 class="text-danger">Error {{error.message}}</h5>
    <p class="font-weight-bold">Note: if you are seeing this error angular is not to blame</p>
    <p>What to do next?</p>

    <p class="font-weight-bold"> Following is the stack trace</p>

    <p class="mt-5" style="background-color: whitesmoke;">
        {{error.details}}
    </p>
}
