<div class="container mt-5">
    <div style="text-align: center;">
        @if(!registerMode) {
        <h2>Find your match</h2>
        <p class="lead"> Come in to view your matches... all you need to do is sign up!</p>
        <div class="text-center">
            <button (click)="registerToggle()" class="btn btn-primary btn-g me-2">Register</button>
            <button class="btn btn-info btn-g me-2">Learn more</button>
        </div>
        } @else {
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-4">
                    <app-register
                    (cancelRegister)="cancelRegisterMode($event)"></app-register>
                </div>
            </div>
        </div>
        }


    </div>
</div>
